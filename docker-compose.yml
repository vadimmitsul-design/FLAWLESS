services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neurohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurohub}
      POSTGRES_DB: neurohub
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurohub -d neurohub"]
      interval: 5s
      timeout: 3s
      retries: 10

  neurohub:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://neurohub:${POSTGRES_PASSWORD:-neurohub}@db:5432/neurohub
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8020:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

services:
  db:
    image: postgres:16-alpine
    # Без политики перезапуска любое падение, нехватка памяти или
    # перезагрузка хоста = простой до ручного вмешательства (аудит 2026-09-07).
    restart: unless-stopped
    environment:
      POSTGRES_USER: neurohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurohub}
      POSTGRES_DB: neurohub
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Порт задаётся переменной, чтобы на одном хосте можно было поднять
      # два экземпляра (внутренний и клиентский) с разными базами.
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurohub -d neurohub"]
      interval: 5s
      timeout: 3s
      retries: 10

  neurohub:
    build: .
    restart: unless-stopped
    # Какой файл настроек уедет ВНУТРЬ контейнера. Флаг `--env-file` у
    # docker compose подставляет переменные только в сам compose-файл и в
    # контейнер ничего не передаёт — без этой переменной второй экземпляр
    # молча поднимался бы с настройками первого.
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://neurohub:${POSTGRES_PASSWORD:-neurohub}@db:5432/neurohub
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${APP_PORT:-8020}:8000"
    depends_on:
      db:
        condition: service_healthy
    # /healthz реально ходит в базу (SELECT 1), поэтому «зависший, но живой»
    # процесс и потерянное соединение с БД видно снаружи, а не только по
    # жалобам пользователей. start_period даёт время на миграции при старте.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:

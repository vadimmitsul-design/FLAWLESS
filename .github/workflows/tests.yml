name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flawless_test
          POSTGRES_PASSWORD: flawless_test
          POSTGRES_DB: flawless_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U flawless_test -d flawless_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://flawless_test:flawless_test@127.0.0.1:55432/flawless_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m ruff check app scripts tests integration_tests
      - run: python -m ruff format --check app scripts tests integration_tests
      - run: python -m mypy
      - run: python -m pytest tests -q
      - run: python -m pytest integration_tests -q
      - run: python -m alembic check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flawless_test
      POSTGRES_PASSWORD: flawless_test
      POSTGRES_DB: flawless_test
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flawless_test -d flawless_test"]
      interval: 1s
      timeout: 3s
      retries: 30

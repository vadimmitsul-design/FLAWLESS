[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares request parameters with Depends, Form and Query defaults.
"app/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["app", "integration_tests"]
follow_imports = "silent"
check_untyped_defs = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["app.core.*", "app.services.*", "app.db.*", "integration_tests.*"]
disallow_untyped_defs = true

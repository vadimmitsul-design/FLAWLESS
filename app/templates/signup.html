{% extends "base.html" %}
{% block title %}Регистрация — Flawless{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
  <div style="width:380px;">
    <div class="logo" style="justify-content:center;margin-bottom:40px;">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><circle cx="12" cy="4" r="1.8"/><circle cx="19.5" cy="16" r="1.8"/><circle cx="4.5" cy="16" r="1.8"/><line x1="12" y1="9.4" x2="12" y2="5.8"/><line x1="14.2" y1="13.4" x2="18" y2="15.3"/><line x1="9.8" y1="13.4" x2="6" y2="15.3"/></svg>
      <span class="wordmark" style="font-size:20px;">Flawless</span>
    </div>
    <div class="card" style="margin-bottom:0;">
      <h1 style="font-size:22px;text-align:center;margin-bottom:26px;">Создать аккаунт</h1>
      {% if error %}<p style="color:var(--bad);font-size:14px;margin-top:0;">{{ error }}</p>{% endif %}
      <form method="post" action="/signup">
        {% if invite_required %}
        <label for="invite">Код приглашения</label>
        <input id="invite" name="invite" required autofocus placeholder="выдаёт администратор">
        {% endif %}
        <label for="name">Имя / компания</label>
        <input id="name" name="name" required {% if not invite_required %}autofocus{% endif %}>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" required minlength="6">
        <button type="submit" style="width: 100%; margin-top: 1.25rem;">Создать аккаунт</button>
      </form>
      <p class="muted" style="margin-top:1.25rem;text-align:center;">Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>
  </div>
</div>
{% endblock %}

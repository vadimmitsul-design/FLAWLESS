<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}neurohub{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:oklch(16% 0.020 262);
    --bg-2:oklch(19% 0.022 262);
    --surface:oklch(22% 0.022 262);
    --surface-hi:oklch(26% 0.024 262);
    --border:oklch(32% 0.02 262);
    --text:oklch(96% 0.008 262);
    --text-dim:oklch(74% 0.02 262);
    --text-faint:oklch(55% 0.018 262);
    --accent:oklch(66% 0.19 291);
    --accent-hi:oklch(74% 0.17 291);
    --accent-2:oklch(66% 0.19 191);
    --warn:oklch(78% 0.15 85);
    --bad:oklch(68% 0.18 25);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',ui-sans-serif,system-ui,sans-serif;}
  a{color:var(--accent-hi);text-decoration:none;}
  a:hover{color:var(--accent);}
  h1,h2,h3{font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;margin:0;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px;}
  .muted{color:var(--text-faint);font-size:0.9rem;}
  table{width:100%;border-collapse:collapse;margin:1rem 0;}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-faint);font-weight:700;padding:0 0 12px;}
  td{padding:14px 0;border-top:1px solid var(--border);font-size:14.5px;}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:700;}
  .badge-ok{background:oklch(66% 0.19 191 / 0.16);color:var(--accent-2);}
  .badge-warn{background:oklch(78% 0.15 85 / 0.16);color:var(--warn);}
  .badge-bad{background:oklch(68% 0.18 25 / 0.16);color:var(--bad);}
  .badge-role{background:oklch(66% 0.19 291 / 0.16);color:var(--accent-hi);}
  form.inline{display:inline;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;margin-bottom:20px;}
  .stat{font-size:2rem;font-weight:600;font-family:'JetBrains Mono';}
  input, select, textarea{
    font:inherit;font-family:'Manrope';height:44px;padding:0 14px;border:1px solid var(--border);border-radius:8px;width:100%;
    background:var(--surface-hi);color:var(--text);outline:none;
  }
  textarea{height:auto;padding:12px 14px;}
  input:focus, textarea:focus{border-color:var(--accent);}
  label{display:block;margin-top:0.75rem;font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:6px;}
  button{width:auto;height:44px;padding:0 20px;border-radius:8px;font-family:'Manrope';font-weight:700;font-size:14.5px;cursor:pointer;border:1px solid transparent;background:var(--accent);color:oklch(15% 0.02 291);}
  button.secondary{background:transparent;color:var(--text);border-color:var(--border);}
  button.danger{background:var(--bad);color:oklch(15% 0 0);}
  code{font-family:'JetBrains Mono';background:var(--surface-hi);border:1px solid var(--border);padding:0.2rem 0.5rem;border-radius:6px;font-size:0.9em;word-break:break-all;}
  .row{display:flex;gap:0.75rem;align-items:center;}
  .logo{display:flex;align-items:center;gap:9px;}
  .logo svg{width:22px;height:22px;stroke:var(--accent-hi);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .logo span{font-family:'Space Grotesk';font-weight:700;font-size:17px;}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-hi);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent-hi);flex-shrink:0;}
</style>
</head>
<body>
{% if customer %}
<div style="border-bottom:1px solid var(--border);">
  <div class="wrap" style="height:68px;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:40px;">
      <a href="/" class="logo" style="color:var(--text);">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><circle cx="12" cy="4" r="1.8"/><circle cx="19.5" cy="16" r="1.8"/><circle cx="4.5" cy="16" r="1.8"/><line x1="12" y1="9.4" x2="12" y2="5.8"/><line x1="14.2" y1="13.4" x2="18" y2="15.3"/><line x1="9.8" y1="13.4" x2="6" y2="15.3"/></svg>
        <span>neurohub</span>
      </a>
      <div style="display:flex;gap:28px;">
        <a href="/" style="font-size:14.5px;font-weight:600;color:var(--text-dim);">Кабинет</a>
        <a href="/shop" style="font-size:14.5px;font-weight:600;color:var(--text-dim);">Магазин</a>
        <a href="/prompts" style="font-size:14.5px;font-weight:600;color:var(--text-dim);">Промпты</a>
        <a href="/archive" style="font-size:14.5px;font-weight:600;color:var(--text-dim);">Архив</a>
        {% if customer.role == 'admin' %}
        <a href="/admin/overview" style="font-size:14.5px;font-weight:600;color:var(--text-dim);">Обзор</a>
        <a href="/admin/orders" style="font-size:14.5px;font-weight:600;color:var(--text-dim);">Заказы</a>
        <a href="/admin/topups" style="font-size:14.5px;font-weight:600;color:var(--text-dim);">Пополнения</a>
        <a href="/admin/password-resets" style="font-size:14.5px;font-weight:600;color:var(--text-dim);">Сброс паролей</a>
        {% endif %}
      </div>
    </div>
    <div class="row">
      {% if customer.role == 'admin' %}<span class="badge badge-role mono">admin</span>{% endif %}
      <span style="font-size:14px;color:var(--text-dim);">{{ customer.name }}</span>
      <div class="avatar">{{ customer.name[:2]|upper }}</div>
      <form class="inline" method="post" action="/logout">
        <button type="submit" class="secondary" style="height:36px;padding:0 14px;font-size:13px;">Выйти</button>
      </form>
    </div>
  </div>
</div>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>

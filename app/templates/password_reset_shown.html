{% extends "base.html" %}
{% block title %}Новый пароль — Flawless{% endblock %}
{% block content %}
<div class="wrap" style="padding:40px 32px 80px;">
<div class="card" style="max-width:520px;margin:0 auto;">
  <h3 style="font-size:18px;margin-bottom:14px;">Новый пароль для {{ target_email }}</h3>
  <p style="color:var(--text-dim);font-size:14.5px;">Показывается один раз — передайте клиенту любым доступным каналом (вне системы), рекомендуйте сменить после входа:</p>
  <p><code style="font-size:14px;display:inline-block;padding:0.5rem 0.75rem;">{{ new_password }}</code></p>
  <a href="/admin/password-resets"><button type="button" style="margin-top:1rem;">К списку заявок</button></a>
</div>
</div>
{% endblock %}
